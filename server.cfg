## Stokeback Mountain - private LAN server for weekly custom game modes

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Core resources only. No ESX/QBCore - we want a blank canvas.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure rconlog

# Our weekly game modes get ensured below this line.
ensure core
#ensure squadmate   # OFF - see #18. Delete the # to bring them back.
ensure infected
#ensure infected_dev
ensure pint
ensure chase
# Ships dormant: nothing runs until /nick start, and that refuses until the
# tag board has coordinates for it.
ensure nick-of-time
# Same again: /tri start refuses until the course is tagged.
ensure the-stokeback-triathlon
ensure telemetry
ensure directorcam

sets sv_projectName "Stokeback Mountain"
sets sv_projectDesc "Weekly custom game modes"
sv_hostname "Stokeback Mountain"
sv_maxclients 12
sv_scriptHookAllowed 0
sv_endpointprivacy true
sets tags "private, custom gamemodes"

# Server-side entity support - needed for spawning peds from the server.
# onesync_population MUST be true or the server spawns no ambient peds/traffic
# at all - core's living-city density multipliers have nothing to populate.
# The horde/campaign still get empty streets: they suppress population
# client-side per-frame while engaged, which holds even with this on.
set onesync on
set onesync_population true

# Stay off the public server list - private group only.
sv_master1 ""

# Keys for telemetry's HTTP routes. Values live in secrets.cfg (gitignored,
# exec'd below) - never in this file, which is public. A route whose key is
# unset is simply off (403), so a fresh clone exposes nothing.
# First deploy after the convar switch: set clap/say to the old hardcoded
# values ('sbmclap' / 'sbmsay') so the existing Stream Deck and workshop
# callers keep working, then rotate them at leisure.
#   set telemetry_clap_key "..."      # /telemetry/clap - Stream Deck sync marker
#   set telemetry_say_key "..."       # /telemetry/say + /telemetry/roster - workshop daemon
#   set telemetry_players_key "..."   # /telemetry/players - connected players JSON
#   set telemetry_mode_key "..."      # /telemetry/modes + /telemetry/mode - remote gametype switch
exec secrets.cfg
